# ---------------------------------------------------------------------------
# 공통 설정. 환경별 값은 application-{profile}.yml 에서 재정의한다.
#   local : 로컬 Docker (기본값)
#   dev   : Dev EKS + Dev RDS
#   demo  : 시연 환경
# ---------------------------------------------------------------------------
spring:
  application:
    name: slash-api

  profiles:
    default: local

  datasource:
    hikari:
      # Pod 별 커넥션 상한을 명시한다.
      # HPA 최대 replica x maximum-pool-size 가 RDS max_connections 의 70% 를 넘지 않도록 관리한다.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # JDBC Session 시간대를 한국 시각으로 고정한다.
      # SQL 조회와 관리 화면에서 별도 변환 없이 한국 시각으로 확인한다.
      connection-init-sql: "SET TIME ZONE 'Asia/Seoul'"

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 전체 삭제를 원천 차단한다. 어떤 프로필에서도 활성화하지 않는다.
    clean-disabled: true

  jooq:
    sql-dialect: postgres

  jackson:
    # 프로젝트 시각 기준은 한국 시각이다. (메시지 프로토콜 정의 3.5 · 11.3)
    # API·WSS·SQS·DB Session·SQL 조회를 모두 Asia/Seoul 로 통일한다.
    time-zone: Asia/Seoul
    serialization:
      # 시각을 epoch 숫자가 아니라 ISO 8601 문자열로 내보낸다.
      # 예: 2026-08-04T10:47:00+09:00
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# ---------------------------------------------------------------------------
# 애플리케이션 고유 설정
# ---------------------------------------------------------------------------
slash:
  auth:
    cognito:
      # Hosted UI 도메인 아래의 userInfo 주소.
      # 예: https://slash.auth.ap-northeast-2.amazoncognito.com/oauth2/userInfo
      #
      # Access Token 에는 이메일이 없어서 사용자를 처음 만들 때 여기서 받아 온다.
      # 스코프에 email 이 포함돼 있어야 한다.
      user-info-uri: ${COGNITO_USER_INFO_URI:}

  cors:
    # 브라우저에서 API 를 호출할 수 있는 오리진. 환경마다 다르다.
    # 기본값은 웹 클라이언트(Vite) 로컬 개발 서버다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  nlu:
    # Helm 배포에서는 같은 Namespace 의 짧은 주소를 주입한다. (문서 3.1.1)
    # Namespace 를 코드에 고정하지 않는다.
    base-url: ${NLU_BASE_URL:http://localhost:8000}
    # 연결·응답 합계 2초. 자동 재시도 없음. (문서 3.7.1)
    timeout: 2s

  device:
    # Heartbeat 30초, 3회 누락 시 OFFLINE (문서 DV-02, NFR-07)
    heartbeat-interval: 30s
    offline-threshold: 90s
    # 기기 Token 유효기간 (문서 3.5.2)
    token-ttl: 24h

  pairing:
    # 등록 코드 5분·1회용 (문서 DV-01)
    code-ttl: 5m

  websocket:
    # 사용자 WSS Ticket 30초·1회용 (문서 3.4.2)
    ticket-ttl: 30s

  dispatch:
    # 미전달 작업 재발행 스윕. (docs/w1-06-wss-routing.md 5.4)
    #
    # Pod 간 전달에 쓰는 Valkey Pub/Sub 은 전달을 보장하지 않는다.
    # 대상 Pod 이 재시작 중이면 메시지가 사라지고 전달은 PENDING 으로 남는데,
    # 그것을 다시 발행하는 그물이다. 주 경로는 Agent 재연결 시 재전송이다.
    resend:
      # @Scheduled 의 문자열 값은 30s 같은 표기를 해석하지 못해 여기만 밀리초로 적는다.
      interval-ms: 5000
      # 발행된 지 이만큼 지나도 PENDING 이면 유실로 본다.
      # 방금 발행한 전달을 곧바로 다시 보내지 않기 위한 여유이기도 하다.
      stale-after: 5s
      # 한 회차에서 처리할 최대 건수. 밀린 양이 많아도 한 회차를 길게 잡지 않는다.
      batch-size: 100
