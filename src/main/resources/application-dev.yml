# ---------------------------------------------------------------------------
# Dev 환경 (Dev EKS + Dev RDS)
#   DB 자격증명과 Cognito 설정은 Secrets Manager 에서 환경 변수로 주입한다.
#   저장소에 평문으로 두지 않는다. (문서 0.8, OB-02)
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Cognito User Pool 발급자 주소
          # 예: https://cognito-idp.ap-northeast-2.amazonaws.com/{userPoolId}
          issuer-uri: ${COGNITO_ISSUER_URI}

slash:
  auth:
    cognito:
      # 이 App Client 가 발급받은 토큰만 받아들인다.
      # 같은 User Pool 에 붙은 다른 Client 의 토큰을 걸러내는 기준이다.
      client-id: ${COGNITO_CLIENT_ID}
      # 없으면 첫 로그인에서 이메일을 구하지 못한다. 기동 시점에 실패하도록 기본값을 두지 않는다.
      user-info-uri: ${COGNITO_USER_INFO_URI}

logging:
  level:
    com.likelion.slash: INFO
